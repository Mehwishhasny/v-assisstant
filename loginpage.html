<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual AI Assistant</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html"; // go back to login if not logged in
    }
  </script>

  <div class="destination">
    <div class="image-container">
      <img src="./images/waterfront-light-bay-water-dusk.jpg" />
      <h1 class="title">T</h1>
    </div>
    <div class="image-container">
      <img src="./images/panoramic-view-dubai-city-illuminated-neon-spectrum.jpg" />
      <h1 class="title">M</h1>
    </div>
    <div class="image-container">
      <img src="./images/architecture-ancient-monument-world-heritage-day-celebration.jpg" />
      <h1 class="title">R</h1>
    </div>
    <div class="image-container">
      <img src="./images/museum.jpg" />
      <h1 class="title">C</h1>
    </div>
  </div>


  <div class="content">
    <div class="main">
      <div class="logo">
        <img src="./images/WhatsApp Image 2025-04-11 at 2.14.49 PM.jpeg" alt="logo"/>
      </div>  
      <h1 class="main-heading">AI Assistant</h1>
    </div>


    <div class="content-layout">
      <div class="left-panel">
    <!-- Language Selector -->
    <div class="language-selector">
      <label for="languageSelect">Language:</label>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
      </select>
    </div>
<br   /> <br   />
    <div class="btn">
      <button onclick="startListening()" class="speak-btn">Start Speaking</button>
      <button id="pauseSpeaking">Pause</button>
      <button id="resumeSpeaking">Resume</button>
      <button id="clearText" class="clear-btn">Clear</button>
    </div>

    <br><br>
    <div class="segment-buttons">

      <div class="segment-buttons">
        <button class="segment" onclick="handleSegmentClick(this)" data-category="mortgage">Mortgage</button>
        <button class="segment" onclick="handleSegmentClick(this)" data-category="auto">Auto Loan</button>
        <button class="segment" onclick="handleSegmentClick(this)" data-category="company">Company Formation</button>
        <button class="segment" onclick="handleSegmentClick(this)" data-category="general">General</button>
      </div>

      
    </div>
    
    <div id="question-section" style="display: none;">
      <label for="customQuestion">Ask a question:</label>
      <select id="customQuestion" style="width: 100%; max-width: 300px; margin-top: 12px; cursor: pointer; padding:4px;">
        <option value="">Select a question</option>
      </select>
      <button onclick="askCustomQuestion()">Ask</button>

            
      <div id="faq" style="display: none; margin-top: 20px;">
        <h5 id="faq-title"></h5>
        <p id="faq-content"></p>
      </div>
          <!-- Hide for now -->
      <button id="askQuestionBtn" style="display: none">🔄 Load Questions</button>
    </div>
    

    <br>
       <!-- Hide for now -->
    <input type="text" id="textInput" placeholder="Type your question..." style="display: none;"/>
    <button id="sendBtn" style="display: none;">Send</button>
    </div>
    <div>
      <iframe src="https://chatbot-roan-mu.vercel.app/">
      </iframe>
    </div>

    <div class="right-panel discussion">
      <h3>🕘Discussion Thread</h3>
      <ul id="history" class="scrollable-thread"></ul>
      <p id="transcript"></p>
      <p id="response"></p>
    </div>
  </div>
</div>

  <script type="module" src="./index.js"></script>
</body>
</html>
