<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual AI Assistant</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html"; // go back to login if not logged in
    }
  </script>
  
  
  <div class="destination">
    <div class="image-container">
      <img src="./images/waterfront-light-bay-water-dusk.jpg" />
      <h1 class="title">T</h1>
    </div>
    <div class="image-container">
      <img src="./images/panoramic-view-dubai-city-illuminated-neon-spectrum.jpg" />
      <h1 class="title">M</h1>
    </div>
    <div class="image-container">
      <img src="./images/architecture-ancient-monument-world-heritage-day-celebration.jpg" />
      <h1 class="title">R</h1>
    </div>
    <div class="image-container">
      <img src="./images/museum.jpg" />
      <h1 class="title">C</h1>
    </div>
  </div>

  <div class="content">
    <div class="main">
      <div class="logo">
        <img src="./images/WhatsApp Image 2025-04-11 at 2.14.49 PM.jpeg" alt="logo"/>
      </div>  
      <h1 class="main-heading">AI Assistant</h1>
    </div>

    <!-- Language Selector -->
    <div class="language-selector">
      <label for="languageSelect">Language:</label>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="btn">
      <button onclick="startListening()">Start Speaking</button>
      <button id="pauseSpeaking">Pause</button>
      <button id="resumeSpeaking">Resume</button>
      <button id="clearText">Clear</button>
    </div>

    <br><br>
    <div class="segment-buttons">
      <button class="segment" onclick="handleSegmentClick(this)" data-category="mortgage">Mortgage</button>
      <button class="segment" onclick="handleSegmentClick(this)" data-category="auto">Auto Loan</button>
      <button class="segment" onclick="handleSegmentClick(this)" data-category="company">Company Formation</button>
      <button class="segment" onclick="handleSegmentClick(this)" data-category="general">General</button>
    </div>
    
    <div id="question-section" style="display: none;">
      <label for="customQuestion">Ask a question:</label>
      <select id="customQuestion">
        <option value="">Select a question</option>
      </select>
      <button id="askQuestionBtn">🔄 Load Questions</button>
      <button onclick="askCustomQuestion()">Ask</button>
    </div>
    

    <br><br>
  
    

    <input type="text" id="textInput" placeholder="Type your question..." />
    <button id="sendBtn">Send</button>

    <p id="transcript">You said: ...</p>
    <p id="response">Assistant: ...</p>

    <h3>🕘 Discussion Thread</h3>
    <ul id="history"></ul>

   <!--<a href="/files/briefing.pptx" download>📥 Download Briefing (PowerPoint)</a>-->
  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
